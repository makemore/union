[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "union-platform"
version = "0.1.0"
description = "Union — modular infrastructure for healthcare systems."
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
]

[tool.setuptools.packages.find]
include = ["union_platform*"]
